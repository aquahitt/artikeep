name: test
on:
  push:
    branches: ["**"]  # tags go through publish.yml, which calls this
  pull_request:
  workflow_call:  # publish.yml runs the suite before releasing
jobs:
  unit:
    strategy:
      matrix:
        os: [ubuntu-latest, macos-latest]
        python: ["3.9", "3.13"]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: ${{ matrix.python }}
      - run: python -m unittest discover -s tests -t . -v
      - run: python -m pip install . && artikeep --version
