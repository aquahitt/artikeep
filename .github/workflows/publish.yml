name: publish
on:
  release:
    types: [published]
  workflow_dispatch:
jobs:
  pypi:
    runs-on: ubuntu-latest
    environment: pypi
    permissions:
      id-token: write  # trusted publishing: no PyPI token stored in the repository
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: "3.13"
      - run: python -m pip install build && python -m build
      - run: python -m pip install dist/*.whl && artikeep --version
      - uses: pypa/gh-action-pypi-publish@release/v1
