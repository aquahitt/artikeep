<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Artifact archive</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Golos+Text:wght@400;500;600&family=Unbounded:wght@500;700&display=swap">
<style>
:root{
  --paper:#ECEFEA; --sheet:#F7F8F5; --raise:#FFFFFF; --ink:#1B2420; --ink-2:#4A5650; --ink-3:#626D67; --line:#C9D0C9; --line-2:#DDE2DC; --hover:#E2E7E1;
  --page:#2E5E4E; --canvas:#2F5C9E; --doc:#6A4A86; --file:#7A5418; --draft:#7A817C;
  --live:#2F5C9E; --exact:#2E5E4E; --recreated:#8F6109; --missing:#A23B2A; --deleted:#626D67;
  --add-bg:#DCEBE2; --rem-bg:#F3DEDA; --hatch:rgba(27,36,32,.07); --scrim:rgba(20,26,23,.42); --focus:#2F5C9E;
  --shadow:0 10px 30px rgba(27,36,32,.14),0 2px 6px rgba(27,36,32,.08);
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --paper:#141A17; --sheet:#1C2420; --raise:#232C27; --ink:#E6ECE7; --ink-2:#B3BEB7; --ink-3:#8E9A92; --line:#36423C; --line-2:#29322D; --hover:#27302B;
  --page:#7FC1A6; --canvas:#8FB2EA; --doc:#C3A3E0; --file:#E0B07A; --draft:#A3AAA5;
  --live:#8FB2EA; --exact:#7FC1A6; --recreated:#E2B455; --missing:#F08F7C; --deleted:#8E9A92;
  --add-bg:#1F3A2E; --rem-bg:#43251F; --hatch:rgba(230,236,231,.06); --scrim:rgba(0,0,0,.55); --focus:#8FB2EA;
  --shadow:0 10px 30px rgba(0,0,0,.45),0 2px 6px rgba(0,0,0,.3);
}}
:root[data-theme="dark"]{
  --paper:#141A17; --sheet:#1C2420; --raise:#232C27; --ink:#E6ECE7; --ink-2:#B3BEB7; --ink-3:#8E9A92; --line:#36423C; --line-2:#29322D; --hover:#27302B;
  --page:#7FC1A6; --canvas:#8FB2EA; --doc:#C3A3E0; --file:#E0B07A; --draft:#A3AAA5;
  --live:#8FB2EA; --exact:#7FC1A6; --recreated:#E2B455; --missing:#F08F7C; --deleted:#8E9A92;
  --add-bg:#1F3A2E; --rem-bg:#43251F; --hatch:rgba(230,236,231,.06); --scrim:rgba(0,0,0,.55); --focus:#8FB2EA;
  --shadow:0 10px 30px rgba(0,0,0,.45),0 2px 6px rgba(0,0,0,.3);
}
*{box-sizing:border-box}
[hidden]{display:none!important}
html{background:var(--paper)}
body{margin:0;color:var(--ink);font:15px/1.5 "Golos Text",system-ui,sans-serif;background:var(--paper)}
a{color:inherit}
button{font:inherit;color:inherit}
button:disabled{opacity:.4;cursor:default}
:focus-visible{outline:2px solid var(--focus);outline-offset:2px;border-radius:6px}
.sr{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0);white-space:nowrap}
h1,h2,h3{font-family:Unbounded,system-ui,sans-serif;margin:0;letter-spacing:-.01em}
.ic{width:18px;height:18px;flex:none;stroke:currentColor;fill:none;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round}
.ic.sm{width:15px;height:15px}

/* ---------- primitives ---------- */
.ib{position:relative;display:inline-grid;place-items:center;width:36px;height:36px;border-radius:10px;border:1px solid var(--line);background:var(--sheet);cursor:pointer;color:var(--ink-2);padding:0;text-decoration:none;flex:none}
.ib:hover:not(:disabled){background:var(--hover);color:var(--ink)}
.ib.ghost{border-color:transparent;background:transparent}
.ib.sm{width:30px;height:30px;border-radius:8px}
[data-tip]{position:relative}
[data-tip]:hover::after,[data-tip]:focus-visible::after{content:attr(data-tip);position:absolute;left:50%;bottom:calc(100% + 8px);transform:translateX(-50%);background:var(--ink);color:var(--paper);font:500 12px/1.3 "Golos Text",system-ui;padding:5px 8px;border-radius:6px;white-space:nowrap;pointer-events:none;z-index:40;animation:tip .14s ease-out}
@keyframes tip{from{opacity:0}to{opacity:1}}
[data-tip-pos="below"]:hover::after,[data-tip-pos="below"]:focus-visible::after{bottom:auto;top:calc(100% + 8px)}
.hacts [data-tip]:hover::after,.hacts [data-tip]:focus-visible::after{left:auto;right:0;transform:none}
.cmp-bar [data-tip]:hover::after,.cmp-bar [data-tip]:focus-visible::after,.dh [data-tip]:hover::after,.dh [data-tip]:focus-visible::after{bottom:auto;top:calc(100% + 8px)}
.cmp-bar>[data-tip]:last-child:hover::after,.dh>[data-tip]:last-child:hover::after,.dh>[data-tip]:last-child:focus-visible::after,.cmp-bar>[data-tip]:last-child:focus-visible::after{left:auto;right:0;transform:none}
.btn{display:inline-flex;align-items:center;gap:8px;height:36px;padding:0 14px;border-radius:10px;border:1px solid var(--ink);background:transparent;cursor:pointer;text-decoration:none;font-size:14px;font-weight:500;white-space:nowrap}
.btn.solid{background:var(--ink);color:var(--paper)}
.seg{display:inline-flex;padding:3px;gap:2px;border-radius:12px;background:var(--line-2)}
.seg button{display:inline-flex;align-items:center;gap:6px;height:30px;padding:0 10px;border:0;border-radius:9px;background:transparent;cursor:pointer;color:var(--ink-2);font-size:13.5px;font-weight:500}
.seg button[aria-pressed="true"]{background:var(--raise);color:var(--ink);box-shadow:0 1px 3px rgba(0,0,0,.14)}
.seg.icons button{width:34px;padding:0;justify-content:center}
.cb{display:flex;align-items:center;gap:10px;padding:5px 6px;margin:0 -6px;border-radius:8px;cursor:pointer}
.cb:hover{background:var(--hover)}
.cb input{position:absolute;opacity:0;width:1px;height:1px}
.cb .box{width:18px;height:18px;border:1.5px solid var(--ink-3);border-radius:5px;display:grid;place-items:center;flex:none;transition:background .12s,border-color .12s}
.cb .box .ic{width:13px;height:13px;stroke-width:2.6;opacity:0;stroke:var(--paper)}
.cb input:checked + .box{background:var(--ink);border-color:var(--ink)}
.cb input:checked + .box .ic{opacity:1}
.cb input:focus-visible + .box{outline:2px solid var(--focus);outline-offset:2px}
.cb .lab{display:flex;align-items:center;gap:8px;min-width:0}
.cb .n{margin-left:auto;font-size:12px;color:var(--ink-3);font-variant-numeric:tabular-nums;background:var(--line-2);border-radius:999px;padding:0 8px;min-width:26px;text-align:center}
.cb.zero{opacity:.5}
.dd{position:relative}
.dd-btn{display:inline-flex;align-items:center;gap:8px;height:36px;padding:0 10px 0 12px;border:1px solid var(--line);border-radius:10px;background:var(--sheet);cursor:pointer;font-size:14px;white-space:nowrap}
.dd-btn:hover{background:var(--hover)}
.dd-btn .k{color:var(--ink-3)}
.dd-btn .ic.chev{transition:transform .15s}
.dd-btn[aria-expanded="true"] .ic.chev{transform:rotate(180deg)}
.dd-menu{position:absolute;top:calc(100% + 6px);left:0;min-width:100%;margin:0;padding:6px;list-style:none;background:var(--raise);border:1px solid var(--line);border-radius:12px;box-shadow:var(--shadow);z-index:35}
.dd-menu[hidden]{display:none}
.dd-menu.right{left:auto;right:0}
.dd-menu li{display:flex;align-items:center;gap:10px;padding:7px 10px;border-radius:8px;cursor:pointer;white-space:nowrap;font-size:14px}
.dd-menu li .ic{opacity:0}
.dd-menu li[aria-selected="true"] .ic{opacity:1}
.dd-menu li.hl,.dd-menu li:hover{background:var(--hover)}
.sw{width:10px;height:10px;border-radius:3px;background:var(--c);flex:none}
.sw.canvas{border-radius:50%} .sw.doc{border-radius:1px;transform:rotate(45deg) scale(.85)} .sw.file{border-radius:1px 5px 1px 1px}
.sw.st{border-radius:50%} .sw.missing{background:transparent;border:1.5px dashed var(--c)}
.t-page{--c:var(--page)} .t-canvas{--c:var(--canvas)} .t-doc{--c:var(--doc)} .t-file{--c:var(--file)} .t-draft{--c:var(--draft)}
.s-live{--c:var(--live)} .s-exact{--c:var(--exact)} .s-recreated{--c:var(--recreated)} .s-missing{--c:var(--missing)} .s-deleted{--c:var(--deleted)}
.chip{display:inline-flex;align-items:center;gap:4px;height:30px;padding:0 3px 0 11px;border-radius:999px;background:var(--raise);border:1px solid var(--line);font-size:13px}
.chip .ib{width:24px;height:24px;border-radius:50%;border:0;background:transparent}
.chip .ib .ic{width:13px;height:13px}
.toast{position:fixed;left:50%;bottom:24px;transform:translateX(-50%);background:var(--ink);color:var(--paper);padding:10px 16px;border-radius:10px;font-size:14px;display:flex;gap:8px;align-items:center;z-index:60;box-shadow:var(--shadow)}
.toast[hidden]{display:none}

/* ---------- header ---------- */
.top{max-width:1440px;margin:0 auto;padding:22px 24px 6px;display:grid;grid-template-columns:auto 1fr auto;gap:14px 24px;align-items:center}
.brand{display:flex;align-items:center;gap:12px}
.mark{width:40px;height:40px;border-radius:12px;background:var(--ink);display:grid;place-items:center;color:var(--paper)}
.mark .ic{width:22px;height:22px}
.top h1{font-size:23px;font-weight:700}
.counts{grid-column:1/-1;color:var(--ink-2);font-size:14px;margin:-2px 0 0;display:flex;flex-wrap:wrap;gap:4px 20px}
.counts b{font-weight:600;color:var(--ink)}
.search{position:relative;max-width:620px;width:100%;justify-self:center}
.search>.ic{position:absolute;left:14px;top:50%;transform:translateY(-50%);color:var(--ink-3);pointer-events:none}
.search input{width:100%;font:inherit;font-size:15px;height:44px;padding:0 84px 0 42px;border:1px solid var(--line);border-radius:12px;background:var(--sheet);color:var(--ink)}
.search input::-webkit-search-cancel-button{display:none}
.search .clear{position:absolute;right:42px;top:50%;transform:translateY(-50%)}
.search kbd{position:absolute;right:10px;top:50%;transform:translateY(-50%);font:12px "Golos Text";color:var(--ink-3);border:1px solid var(--line);border-radius:6px;padding:1px 7px;background:var(--paper)}
.hacts{display:flex;gap:8px}
@media (max-width:760px){.top{grid-template-columns:1fr auto}.search{grid-column:1/-1;order:3;max-width:none}.top h1{font-size:19px}}
.tabs{max-width:1440px;margin:10px auto 0;padding:0 24px;display:flex;gap:4px;border-bottom:1px solid var(--line)}
.tabs button{display:inline-flex;align-items:center;gap:8px;background:none;border:0;border-bottom:3px solid transparent;padding:10px 12px;cursor:pointer;font-weight:500;color:var(--ink-2)}
.tabs button[aria-selected="true"]{color:var(--ink);border-bottom-color:var(--ink)}
.tabs .n{font-size:12px;color:var(--ink-3);background:var(--line-2);border-radius:999px;padding:0 7px;font-weight:500}

/* ---------- layout ---------- */
.main{max-width:1440px;margin:0 auto;padding:18px 24px 80px;display:grid;grid-template-columns:232px 1fr;gap:28px}
.facets{display:grid;align-content:start;gap:18px;font-size:14px;position:sticky;top:12px;max-height:calc(100vh - 24px);overflow:auto;padding:0 4px 0 6px}
.facets h4{margin:0 0 4px;font-size:12.5px;font-weight:600;color:var(--ink-3)}
.facets .reset{display:inline-flex;align-items:center;gap:6px;background:none;border:0;padding:0;color:var(--ink-2);cursor:pointer;font-size:13px}
.tool{display:flex;flex-wrap:wrap;gap:10px;align-items:center;margin-bottom:12px}
.tool .grow{flex:1}
.tool .count{font-size:14px;color:var(--ink-2)}
.only-mobile{display:none}
.ib .dot{position:absolute;top:6px;right:6px;width:8px;height:8px;border-radius:50%;background:var(--canvas);border:2px solid var(--sheet)}
@media (max-width:900px){.only-mobile{display:inline-grid}}
.active{display:flex;flex-wrap:wrap;gap:6px;margin:-2px 0 14px}
.active:empty{display:none}
.recent{margin-bottom:26px}
.sec-h{display:flex;align-items:baseline;gap:10px;margin:0 0 12px;flex-wrap:wrap}
.sec-h h2{font-size:16px;font-weight:500}
.sec-h span{font-size:13px;color:var(--ink-3)}

/* cards */
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(var(--cw,230px),1fr));gap:16px}
.size-s{--cw:180px} .size-m{--cw:230px} .size-l{--cw:320px}
.card{position:relative;display:flex;flex-direction:column;border:1px solid var(--line);border-radius:12px;background:var(--sheet);overflow:hidden;transition:border-color .12s,box-shadow .12s}
.card::before{content:"";position:absolute;left:0;top:0;bottom:0;width:5px;background:var(--c);z-index:1}
.card:hover{border-color:var(--ink-3);box-shadow:var(--shadow)}
.card.cur{outline:2px solid var(--focus);outline-offset:1px}
.card .main-btn,.lrow .main-btn{position:absolute;inset:0;cursor:pointer;z-index:2;border:0;background:transparent;padding:0;border-radius:12px}
.card .main-btn:focus-visible,.lrow .main-btn:focus-visible{outline:2px solid var(--focus);outline-offset:-2px}
.th{aspect-ratio:16/10;background:var(--line-2) center top/cover no-repeat;border-bottom:1px solid var(--line-2);position:relative}
.th.none{display:grid;place-items:center;background:repeating-linear-gradient(135deg,var(--hatch) 0 8px,transparent 8px 16px)}
.glyph{width:34px;height:34px;border:3px solid var(--c);opacity:.55}
.glyph.page{border-radius:6px} .glyph.canvas{border-radius:50%} .glyph.doc{transform:rotate(45deg) scale(.8);border-radius:3px} .glyph.file{border-radius:3px 14px 3px 3px}
.card .bd{padding:10px 12px 12px 16px;display:grid;gap:5px}
.card h3{font-family:"Golos Text",system-ui;font-size:15px;font-weight:600;line-height:1.3;letter-spacing:0}
.size-s .card h3{font-size:13.5px}
.meta{display:flex;flex-wrap:wrap;gap:3px 12px;font-size:12.5px;color:var(--ink-3)}
.meta .copy{color:var(--c)}
.meta .mi{display:inline-flex;align-items:center;gap:4px}
.qa{position:absolute;top:8px;right:8px;display:flex;gap:6px;z-index:3;opacity:0;transform:translateY(-4px);transition:opacity .12s,transform .12s}
.card:hover .qa,.card:focus-within .qa{opacity:1;transform:none}
.qa .ib{background:var(--raise);box-shadow:0 2px 8px rgba(0,0,0,.16);border-color:var(--line-2)}
@media (hover:none){.qa{opacity:1;transform:none}}
.stamp{position:absolute;bottom:10px;right:10px;transform:rotate(-4deg);border:2px solid var(--c);color:var(--c);background:color-mix(in srgb,var(--sheet) 85%,transparent);border-radius:6px;padding:1px 8px;font-size:12px;font-weight:600;z-index:1}
.vstrip{display:flex;gap:3px;align-items:end;height:16px;margin-top:2px}
.vstrip i{width:7px;border-radius:2px;background:var(--c);opacity:.35}
.vstrip i:last-child{opacity:1}

/* list */
.list{display:grid;border:1px solid var(--line);border-radius:12px;background:var(--sheet);overflow:hidden}
.lrow{position:relative;display:grid;grid-template-columns:84px minmax(0,1fr) 130px 110px 64px 120px 112px 104px;gap:14px;align-items:center;padding:10px 14px;border-top:1px solid var(--line-2)}
.lrow:first-child{border-top:0}
.lrow.head{font-size:12.5px;color:var(--ink-3);background:var(--paper)}
.lrow:not(.head):hover{background:var(--paper)}
.lrow.cur{background:color-mix(in srgb,var(--canvas) 10%,transparent)}
.lrow .main-btn{border-radius:0}
.lrow .th{aspect-ratio:16/10;border:1px solid var(--line-2);border-radius:6px}
.lrow b{font-weight:600;display:block;line-height:1.3}
.lrow small{color:var(--ink-3);display:block;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.lrow .n{text-align:right;white-space:nowrap;font-variant-numeric:tabular-nums;color:var(--ink-2)}
.lrow .acts{display:flex;gap:2px;justify-content:flex-end;position:relative;z-index:3}
.tag{display:inline-flex;align-items:center;gap:6px;font-size:13px}
@media (max-width:1150px){.lrow{grid-template-columns:72px minmax(0,1fr) 100px 60px 100px}.lrow .c-proj,.lrow .c-iss,.lrow .c-date{display:none}}
@media (max-width:600px){.lrow{grid-template-columns:64px minmax(0,1fr) 70px}.lrow .tag,.lrow .n{display:none}}
.group{margin-bottom:26px}
.lost{margin-top:22px;border:1px dashed var(--missing);border-radius:12px;padding:2px 16px}
.lost summary{display:flex;align-items:center;gap:8px;cursor:pointer;color:var(--missing);font-weight:500;padding:10px 0;list-style:none}
.lost summary::-webkit-details-marker{display:none}
.lost summary .ic{transition:transform .15s}
.lost[open] summary .ic{transform:rotate(180deg)}
.lost ul{list-style:none;margin:0 0 12px;padding:0;columns:2 300px;column-gap:28px}
.lost li{break-inside:avoid;border-left:3px solid var(--c);padding:3px 0 3px 10px;margin-bottom:6px}
.lost li button{background:none;border:0;padding:0;cursor:pointer;text-align:left;font-weight:500}
.lost li small{display:block;color:var(--ink-3);font-size:12.5px}
.empty{padding:48px 0;color:var(--ink-2);display:grid;justify-items:start;gap:12px}

/* drawer */
.scrim{position:fixed;inset:0;background:var(--scrim);z-index:20}
.drawer{position:fixed;top:0;right:0;bottom:0;width:min(620px,100vw);background:var(--sheet);border-left:1px solid var(--line);z-index:21;display:grid;grid-template-rows:auto 1fr;box-shadow:-12px 0 40px rgba(0,0,0,.14)}
.drawer[hidden],.scrim[hidden],.cmp[hidden],.help[hidden]{display:none}
.dh{display:flex;gap:6px;align-items:center;padding:10px 12px;border-bottom:1px solid var(--line-2)}
.dh h2{font-size:17px;font-weight:500;line-height:1.25;margin:0 auto 0 6px}
.dh .nav{display:flex;gap:2px;padding-right:8px;border-right:1px solid var(--line-2)}
.db{overflow:auto;padding:16px 18px 40px;display:grid;gap:18px;align-content:start}
.pv{position:relative;border:1px solid var(--line);border-radius:12px;overflow:hidden;background:#fff;height:340px}
.pv iframe{width:200%;height:200%;border:0;transform:scale(.5);transform-origin:0 0}
.pv>.ib{position:absolute;right:10px;bottom:10px;background:var(--raise);box-shadow:0 2px 8px rgba(0,0,0,.18)}
.pv.none{display:grid;place-items:center;background:repeating-linear-gradient(135deg,var(--hatch) 0 8px,transparent 8px 16px);color:var(--ink-2);text-align:center;padding:24px}
.dacts{display:flex;flex-wrap:wrap;gap:8px;align-items:center}
.dacts .sp{flex:1}
.facts{display:grid;grid-template-columns:110px 1fr;gap:7px 12px;font-size:14px;margin:0}
.facts dt{color:var(--ink-3)} .facts dd{margin:0}
.issues{display:flex;flex-wrap:wrap;gap:6px}
.issue{display:inline-flex;align-items:center;gap:4px;height:26px;padding:0 9px 0 6px;border-radius:999px;border:1px solid var(--line);text-decoration:none;font-size:13px;background:var(--raise)}
.issue:hover{border-color:var(--ink-3)}
.issue .ic{width:14px;height:14px;color:var(--page)}
.desc{color:var(--ink-2);margin:0}
.vsec .sec-h{align-items:center}
.vsec .sec-h h2{font-family:"Golos Text",system-ui;font-size:15px;font-weight:600;letter-spacing:0;margin-right:auto}
.tl{list-style:none;margin:0;padding:0 0 0 14px;border-left:2px solid var(--line)}
.tl li{position:relative;display:grid;grid-template-columns:1fr auto;gap:2px 10px;padding:7px 6px 9px 12px;border-radius:8px}
.tl li::before{content:"";position:absolute;left:-21px;top:13px;width:10px;height:10px;border-radius:50%;background:var(--sheet);border:2px solid var(--c)}
.tl li:first-child::before{background:var(--c)}
.tl li.picked{background:color-mix(in srgb,var(--canvas) 10%,transparent)}
.tl .vh{display:flex;gap:8px;align-items:baseline;flex-wrap:wrap}
.tl .vn{font-family:Unbounded,system-ui;font-size:12px}
.tl .vl{font-weight:600}
.tl small{grid-column:1;color:var(--ink-3)}
.tl .va{grid-row:1/3;grid-column:2;display:flex;gap:2px;align-items:center}
.tl .va .cb{margin:0;padding:6px}

/* compare */
.cmp{position:fixed;inset:0;z-index:30;background:var(--paper);display:grid;grid-template-rows:auto 1fr auto;padding:12px 14px 14px}
.cmp-bar{display:flex;flex-wrap:wrap;gap:8px 12px;align-items:center;margin-bottom:10px}
.cmp-bar h2{font-size:16px;font-weight:500;margin-right:auto}
.cmp-bar .grp{display:flex;gap:6px;align-items:center;flex-wrap:wrap}
.panes{display:grid;grid-template-columns:1fr 1fr;gap:12px;min-height:0}
.cmp.solo .panes{grid-template-columns:1fr}
.cmp.solo .pane.b{display:none}
.pane{display:grid;grid-template-rows:auto 1fr;border:1px solid var(--line);border-radius:12px;overflow:hidden;background:var(--sheet);min-height:0}
.pane header{padding:6px 8px 6px 12px;font-size:13px;border-bottom:1px solid var(--line-2);display:flex;gap:10px;align-items:center}
.pane header .sum{color:var(--ink-3);margin-right:auto}
.pane iframe{width:100%;height:100%;border:0;background:#fff}
.diff{margin-top:12px;border:1px solid var(--line);border-radius:12px;background:var(--sheet);max-height:32vh;overflow:auto;padding:0 14px 12px}
.diff.closed{padding-bottom:0}
.diff.closed .dl,.diff.closed .more,.diff.closed p{display:none}

    ${it.desc ? `<p class="desc">${esc(it.desc)}</p>` : ""}
    ${it.versions.length ? `<div class="vsec"><div class="sec-h"><h2>${pl(it.versions.length, "version")}</h2>
      ${it.versions.length > 2 ? `<button class="btn" type="button" data-cmp-picked ${picked ? "" : "disabled"}>${ic("compare")}${picked ? t("comparePicked", Math.min(...S.pick), Math.max(...S.pick)) : t("pickTwo")}</button>` : ""}</div>
      <ol class="tl t-${it.type}">${vs.map(v => `<li class="${S.pick.includes(v.n) ? "picked" : ""}"><div class="vh"><span class="vn">v${v.n}</span><span class="vl">${esc(v.label || (v.n === cur.n ? t("current") : t("noLabel")))}</span></div>
        <small>${esc(v.at)}${sumText(it, v) ? ", " + esc(sumText(it, v)) : ""}</small>
        <span class="va">${ia("ext", t("openV", v.n), verUrl(it, v), "sm ghost")}${v.n > 1 ? ib("compare", t("compareWith", v.n - 1), `data-cmp="${v.n - 1}|${v.n}"`, "sm ghost") : ""}${it.versions.length > 2 ? `<label class="cb" data-tip="${t("pickTip")}"><input type="checkbox" data-pickv="${v.n}" ${S.pick.includes(v.n) ? "checked" : ""} aria-label="${t("pickV", v.n)}"><span class="box">${ic("check")}</span></label>` : ""}</span></li>`).join("")}</ol></div>` : ""}
  </div>`;
  dr.hidden = false; scrim.hidden = false;
}

/* ---------- compare ---------- */
function diffBlock(it, a, b) {
  const lo = Math.min(a, b), hi = Math.max(a, b);
  let diff = null, note = "";
  if (a === b) note = t("same");
  else if (hi === lo + 1) diff = it.versions.find(v => v.n === hi).diff;
  else if (lo === 1 && hi === it.versions[it.versions.length - 1].n) diff = it.firstLast;
  else note = t("pairNote");
  const closed = S.diffClosed ? " closed" : "";
  const head = diff ? (diff.lines.length ? t("diffHead", diff.add, diff.rem) + (lo !== a ? t("leftLater") : "") : t("textSame")) : t("diffTitle");
  const toggle = ib(S.diffClosed ? "up" : "chev", S.diffClosed ? t("showDiff") : t("hideDiff"), "data-diff-toggle", "sm ghost");
  if (!diff || !diff.lines.length) return `<div class="diff${closed}"><div class="dh2">${ic("text")}<h3>${head}</h3>${toggle}</div><p>${note || t("styleOnly")}</p></div>`;
  let lastFile = "";
  const lines = diff.lines.map(l => { const f = l.file !== lastFile ? (lastFile = l.file, `<span class="f">${esc(l.file)}</span>`) : "";
    return f + `<span class="op ${l.op === "+" ? "add" : "rem"}">${l.op === "+" ? "+" : "−"}</span><span class="${l.op === "+" ? "add" : "rem"}">${esc(l.text)}</span>`; }).join("");
  return `<div class="diff${closed}"><div class="dh2">${ic("text")}<h3>${head}</h3>${toggle}</div><div class="dl">${lines}</div>${diff.more ? `<p class="more">${t("moreLines", diff.more)}</p>` : ""}</div>`;
}
function renderCompare() {
  const box = document.getElementById("cmp");
  if (!S.cmp) { box.hidden = true; return; }
  const it = items.find(i => i.dir === S.cmp.dir), a = S.cmp.a, b = S.cmp.b, last = it.versions[it.versions.length - 1].n;
  const opts = Object.fromEntries(it.versions.slice().reverse().map(v => [v.n, `v${v.n}, ${v.at}${v.label ? ", " + v.label.slice(0, 40) : ""}`]));
  const pane = (n, side) => { const v = it.versions.find(x => x.n === n); return `<section class="pane ${side}"><header><b>v${v.n}</b><span>${esc(v.at)}</span><span class="sum">${esc(sumText(it, v))}</span>${ia("ext", t("openSep"), verUrl(it, v), "sm ghost")}</header><iframe src="${verUrl(it, v)}" title="${side === "a" ? t("left") : t("right")}: v${v.n}"></iframe></section>`; };
  box.className = "cmp" + (S.solo ? " solo" : "");
  box.innerHTML = `<div class="cmp-bar"><h2>${esc(it.title)}</h2>${ib("x", t("closeCmp"), "data-cmp-close")}
    <span class="grp">${ib("left", t("prevPair"), `data-pair="-1" ${Math.min(a, b) <= 1 ? "disabled" : ""}`)}${dropdown("cmp-a", t("left"), opts, a)}${ib("swap", t("swap"), "data-swap")}${dropdown("cmp-b", t("right"), opts, b, "right")}${ib("right", t("nextPair"), `data-pair="1" ${Math.max(a, b) >= last ? "disabled" : ""}`)}</span>
    <span class="seg icons" role="group" aria-label="${t("layout")}">${[["", "compare", t("both")], ["1", "single", t("leftOnly")]].map(([k, i, tt]) => `<button type="button" data-solo="${k}" aria-pressed="${S.solo === !!k}" aria-label="${tt}" data-tip="${tt}">${ic(i)}</button>`).join("")}</span></div>
    <div class="panes">${pane(a, "a")}${pane(b, "b")}</div>${diffBlock(it, a, b)}`;
  box.hidden = false;
}
function openCompare(dir, a, b) { S.cmp = {dir, a: +a, b: +b}; renderCompare(); const c = document.querySelector("#cmp [data-cmp-close]"); if (c) c.focus(); }

/* ---------- help ---------- */
document.getElementById("helpcard").innerHTML = `<h2 id="htitle">${t("keys")} <button class="ib ghost sm" type="button" data-help-close aria-label="${t("close")}">${ic("x", "sm")}</button></h2>
  <dl class="keys"><dt><kbd class="k">/</kbd></dt><dd>${t("kSearch")}</dd><dt><kbd class="k">G</kbd></dt><dd>${t("kGrid")}</dd><dt><kbd class="k">L</kbd></dt><dd>${t("kList")}</dd>
    <dt><kbd class="k">←</kbd><kbd class="k">→</kbd></dt><dd>${t("kArrows")}</dd>
    <dt><kbd class="k">C</kbd></dt><dd>${t("kC")}</dd><dt><kbd class="k">Esc</kbd></dt><dd>${t("kEsc")}</dd><dt><kbd class="k">?</kbd></dt><dd>${t("kHelp")}</dd></dl>`;

/* ---------- render ---------- */
function render() {
  const live = items.filter(i => !i.service), n = c => live.filter(i => i.status === c).length;
  const vers = live.reduce((s, i) => s + i.versions.length, 0);
  const projects = new Set(live.map(i => i.project)).size;
  document.getElementById("counts").innerHTML = `<span>${t("counts", pl(live.length, "item"), pl(projects, "projectIn"))}</span><span>${t("withCopy", live.length - n("missing"), n("missing"))}</span><span>${t("inHistory", pl(vers, "version"))}</span><span>${t("updated", esc(D.built))}</span>`;
  document.getElementById("tabs").innerHTML = [["items", t("tabItems"), live.length], ["drafts", t("tabDrafts"), D.drafts.length]].map(([k, l, c]) =>
    `<button role="tab" type="button" data-tab="${k}" aria-selected="${S.tab === k}">${l}<span class="n">${c}</span></button>`).join("");
  document.getElementById("main").innerHTML = S.tab === "items" ? renderItems() : renderDrafts();
  document.getElementById("qclear").hidden = !S.q;
  renderDrawer(); renderCompare(); setHash();
}
function openItem(dir) { S.open = dir; S.pick = []; render(); const c = document.querySelector("#drawer [data-close]"); if (c) c.focus(); }
function closeItem() { const back = S.open; S.open = null; render(); const el = document.querySelector(`[data-open="${CSS.escape(back || "")}"]`); if (el) el.focus(); }
function closeMenus() { document.querySelectorAll(".dd-menu:not([hidden])").forEach(m => { m.hidden = true; m.previousElementSibling.setAttribute("aria-expanded", "false"); }); }
function chooseDd(dd, value) {
  const key = dd.dataset.dd;
  if (key === "cmp-a" || key === "cmp-b") { S.cmp[key.slice(-1)] = +value; renderCompare(); }
  else { S[key] = value; saveUi(); render(); }
  const btn = document.querySelector(`[data-dd="${key}"] .dd-btn`); if (btn) btn.focus();
}

document.addEventListener("click", e => {
  const ddBtn = e.target.closest(".dd-btn");
  if (ddBtn) { const menu = ddBtn.nextElementSibling, opening = menu.hidden; closeMenus(); if (opening) { menu.hidden = false; ddBtn.setAttribute("aria-expanded", "true");
      const sel = menu.querySelector('[aria-selected="true"]') || menu.firstElementChild; menu.querySelectorAll("li").forEach(l => l.classList.toggle("hl", l === sel)); sel.scrollIntoView({block: "nearest"}); } return; }
  const opt = e.target.closest(".dd-menu li");
  if (opt) { chooseDd(opt.closest(".dd"), opt.dataset.value); return; }
  closeMenus();
  const el = e.target.closest("[data-open],[data-close],[data-tab],[data-view],[data-size],[data-reset],[data-cmp],[data-cmp-close],[data-cmp-picked],[data-toggle-facets],[data-copy-link],[data-quick-cmp],[data-unchip],[data-step],[data-pair],[data-swap],[data-solo],[data-diff-toggle],[data-help-close]");
  if (!el) { if (e.target.id === "scrim") closeItem(); if (e.target.id === "help") e.target.hidden = true; return; }
  if (el.disabled) return;
  const d = el.dataset;
  if (d.open) openItem(d.open);
  else if (el.hasAttribute("data-close")) closeItem();
  else if (d.tab) { S.tab = d.tab; render(); }
  else if (d.view) { S.view = d.view; saveUi(); render(); }
  else if (d.size) { S.size = d.size; saveUi(); render(); }
  else if (el.hasAttribute("data-reset")) { Object.assign(S, {q: "", projects: [], agents: [], types: [], copies: [], issuesOnly: false}); q.value = ""; render(); }
  else if (d.cmp) { const [a, b] = d.cmp.split("|"); openCompare(S.open, a, b); }
  else if (el.hasAttribute("data-cmp-picked")) { if (S.pick.length === 2) openCompare(S.open, Math.min(...S.pick), Math.max(...S.pick)); }
  else if (el.hasAttribute("data-cmp-close")) { S.cmp = null; renderCompare(); }
  else if (el.hasAttribute("data-toggle-facets")) { S.facetsOpen = !S.facetsOpen; render(); document.querySelector("[data-toggle-facets]").focus(); }
  else if (d.copyLink) { const it = items.find(i => i.dir === d.copyLink); copy(linkTo(it), t("copied", it.title)); }
  else if (d.quickCmp) { const it = items.find(i => i.dir === d.quickCmp); S.open = it.dir; S.pick = []; render(); openCompare(it.dir, 1, it.versions[it.versions.length - 1].n); }
  else if (d.unchip) { const k = d.unchip; if (k === "q") { S.q = ""; q.value = ""; } else if (k === "issuesOnly") S.issuesOnly = false; else S[k].splice(S[k].indexOf(d.val), 1); render(); }
  else if (d.step) { const i = visibleOrder.indexOf(S.open) + +d.step; if (visibleOrder[i]) { S.open = visibleOrder[i]; S.pick = []; render(); const b = document.querySelector(`#drawer [data-step="${d.step}"]`); if (b && !b.disabled) b.focus(); else document.querySelector("#drawer [data-close]").focus(); } }
  else if (d.pair) { const st = +d.pair, it = items.find(i => i.dir === S.cmp.dir), last = it.versions[it.versions.length - 1].n, na = S.cmp.a + st, nb = S.cmp.b + st;
    if (Math.min(na, nb) >= 1 && Math.max(na, nb) <= last) { S.cmp.a = na; S.cmp.b = nb; renderCompare(); const b = document.querySelector(`#cmp [data-pair="${st}"]`); if (b && !b.disabled) b.focus(); } }
  else if (el.hasAttribute("data-swap")) { [S.cmp.a, S.cmp.b] = [S.cmp.b, S.cmp.a]; renderCompare(); document.querySelector("#cmp [data-swap]").focus(); }
  else if (d.solo !== undefined) { S.solo = !!d.solo; renderCompare(); }
  else if (el.hasAttribute("data-diff-toggle")) { S.diffClosed = !S.diffClosed; renderCompare(); document.querySelector("#cmp [data-diff-toggle]").focus(); }
  else if (el.hasAttribute("data-help-close")) document.getElementById("help").hidden = true;
});
document.addEventListener("change", e => {
  const el = e.target;
  if (el.dataset.f) { const arr = S[el.dataset.f]; el.checked ? arr.push(el.value) : arr.splice(arr.indexOf(el.value), 1); render(); const x = document.querySelector(`[data-f="${el.dataset.f}"][value="${CSS.escape(el.value)}"]`); if (x) x.focus(); }
  else if (el.dataset.flag) { S[el.dataset.flag] = el.checked; render(); const x = document.querySelector(`[data-flag="${el.dataset.flag}"]`); if (x) x.focus(); }
  else if (el.dataset.pickv) { const n = +el.dataset.pickv; el.checked ? S.pick.push(n) : S.pick.splice(S.pick.indexOf(n), 1); if (S.pick.length > 2) S.pick.shift(); renderDrawer(); const x = document.querySelector(`[data-pickv="${n}"]`); if (x) x.focus(); }
});
const q = document.getElementById("q"); q.value = S.q;
q.addEventListener("input", () => { S.q = q.value.trim(); render(); q.focus(); });
document.getElementById("qclear").addEventListener("click", () => { S.q = ""; q.value = ""; render(); q.focus(); });
document.addEventListener("keydown", e => {
  const menu = document.querySelector(".dd-menu:not([hidden])");
  if (menu) {
    const opts = [...menu.querySelectorAll("li")], i = opts.findIndex(o => o.classList.contains("hl"));
    if (e.key === "ArrowDown" || e.key === "ArrowUp") { e.preventDefault(); const n = opts[(i + (e.key === "ArrowDown" ? 1 : -1) + opts.length) % opts.length]; opts.forEach(o => o.classList.toggle("hl", o === n)); n.scrollIntoView({block: "nearest"}); return; }
    if (e.key === "Enter" || e.key === " ") { e.preventDefault(); if (opts[i]) chooseDd(menu.closest(".dd"), opts[i].dataset.value); return; }
    if (e.key === "Escape" || e.key === "Tab") { const b = menu.previousElementSibling; closeMenus(); if (e.key === "Escape") b.focus(); return; }
  }
  const el = document.activeElement, typing = el && /INPUT|TEXTAREA/.test(el.tagName) && el.type !== "checkbox";
  if (e.key === "Escape") { const h = document.getElementById("help"); if (!h.hidden) h.hidden = true; else if (S.cmp) { S.cmp = null; renderCompare(); } else if (S.open) closeItem(); else if (typing) q.blur(); return; }
  if (typing || e.metaKey || e.ctrlKey || e.altKey) return;
  if (e.key === "/") { e.preventDefault(); q.focus(); }
  else if (e.key === "?") { document.getElementById("help").hidden = false; document.querySelector("[data-help-close]").focus(); }
  else if ((e.key === "g" || e.key === "п") && S.tab === "items" && !S.open) { S.view = "grid"; saveUi(); render(); }
  else if ((e.key === "l" || e.key === "д") && S.tab === "items" && !S.open) { S.view = "list"; saveUi(); render(); }
  else if (e.key === "ArrowLeft" || e.key === "ArrowRight") {
    const st = e.key === "ArrowLeft" ? -1 : 1;
    const b = S.cmp ? document.querySelector(`#cmp [data-pair="${st}"]`) : S.open ? document.querySelector(`#drawer [data-step="${st}"]`) : null;
    if (b && !b.disabled) { e.preventDefault(); b.click(); }
  }
  else if ((e.key === "c" || e.key === "с") && S.open && !S.cmp) { const it = items.find(i => i.dir === S.open); if (it.versions.length > 1) openCompare(it.dir, 1, it.versions[it.versions.length - 1].n); }
});
document.getElementById("helpbtn").addEventListener("click", () => { document.getElementById("help").hidden = false; document.querySelector("[data-help-close]").focus(); });
window.addEventListener("hashchange", () => {
  const h = new URLSearchParams(location.hash.slice(1)), a = h.get("a") || null, qq = h.get("q") || "";
  if (a !== S.open || qq !== S.q) { S.open = a; S.q = qq; q.value = qq; S.pick = []; render(); }
});
const themeBtn = document.getElementById("theme"), themes = ["auto", "light", "dark"], themeIcon = {auto: "auto", light: "sun", dark: "moon"};
let theme = "auto"; try { theme = localStorage.getItem("archive-theme") || "auto"; } catch (e) {}
function applyTheme() { if (theme === "auto") document.documentElement.removeAttribute("data-theme"); else document.documentElement.setAttribute("data-theme", theme);
  themeBtn.innerHTML = ic(themeIcon[theme]); themeBtn.dataset.tip = t("themeTip", L.themes[theme]); themeBtn.setAttribute("aria-label", t("theme", L.themes[theme])); }
themeBtn.addEventListener("click", () => { theme = themes[(themes.indexOf(theme) + 1) % 3]; try { localStorage.setItem("archive-theme", theme); } catch (e) {} applyTheme(); });
applyTheme(); render();
</script>
</body>
